<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Keycap Background -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="#2c2e31" stroke="#e2b714" stroke-width="2.5"/>
  <!-- Inner Key Bevel -->
  <rect x="11" y="11" width="42" height="42" rx="8" fill="#323437" />
  <!-- Monkey Ears subtle hint & Devanagari Letter 'क' -->
  <circle cx="16" cy="16" r="4" fill="#e2b714" opacity="0.4" />
  <circle cx="48" cy="16" r="4" fill="#e2b714" opacity="0.4" />
  <!-- Stylized Hindi 'क' -->
  <text x="32" y="39" font-family="'Noto Sans Devanagari', 'Arial', sans-serif" font-size="26" font-weight="bold" fill="#e2b714" text-anchor="middle">क</text>
  <!-- Active Caret Dot -->
  <circle cx="44" cy="44" r="2.5" fill="#e2b714"/>
</svg>